# config.yaml
hyperparameters:
  seed: 1337
  log_file: "./logs/mainrun.log"
  data_dir: "./artifacts/datasets/refinedweb_Nexact22M"
  output_dir: "./artifacts/runs/train"

  # training param
  lr: 0.003         # Scientific notation (6e-3) is also supported
  weight_decay: 1e-4
  evals_per_epoch: 3
  betas: [0.9, 0.95]
  batch_size: 32          # batch per processing
  accumulation_steps: 8   # num_minibatch = batch * accumulation_steps
  # Kaplan adaptation
  warmup_step: 3000
  z_loss_weight: 1e-4
  
  vocab_size: 50432

  attn_type: "standard"
  block_size: 2048
  n_layer: 8
  n_head: 4
  d_model: 288
  dropout: 0.0
  is_RoPE: True
  mlp_type: 'standard'
  
  
  # d_compression: 128
  # nb_features: 256
  
checkpointing:
  save_latest: true
  save_best: true
  save_step_checkpoints: true
  step_checkpoint_interval: 100

