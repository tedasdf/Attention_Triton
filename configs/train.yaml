# config.yaml
hyperparameters:
  seed: 1337
  log_file: "./logs/mainrun.log"
  data_dir: "./artifacts/datasets/hn_1M"
  output_dir: "./artifacts/runs/train/run_2026_03_15_175902"

  # training param
  epochs: 7
  lr: 0.003         # Scientific notation (6e-3) is also supported
  weight_decay: 0.05
  evals_per_epoch: 3
  betas: [0.99, 0.999]
  batch_size: 64          # batch per processing
  accumulation_steps: 4   # num_minibatch = batch * accumulation_steps

  
  attn_type: "standard"
  block_size: 64
  n_layer: 6
  n_head: 6
  d_model: 384
  dropout: 0.1
  mlp_type: 'standard'
  
  # Kaplan adaptation
  warmup_step: 3000
  
  # d_compression: 128
  # nb_features: 256
  
checkpointing:
  save_latest: true
  save_best: true
  save_step_checkpoints: true
  step_checkpoint_interval: 100

